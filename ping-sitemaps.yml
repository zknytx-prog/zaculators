name: Ping Google Sitemap

on:
  schedule:
    - cron: '0 13 * * *'  # runs daily at 1 PM UTC (8 AM Houston time)
  workflow_dispatch:  # lets you also trigger it manually from GitHub's Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google for zaculators.com sitemap
        run: curl -s "https://www.google.com/ping?sitemap=https://zaculators.com/sitemap.xml"
      - name: Ping Google for bizycalc.com sitemap
        run: curl -s "https://www.google.com/ping?sitemap=https://bizycalc.com/sitemap.xml"
