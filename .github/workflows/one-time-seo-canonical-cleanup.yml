name: One-time SEO Canonical Cleanup

on:
  push:
    branches:
      - fix-seo-indexing-2026-09-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-seo-indexing-2026-09-06
          fetch-depth: 0
      - name: Canonicalize sitemap and internal links
        run: python .github/scripts/seo_cleanup.py
      - name: Validate sitemap basics
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('sitemap.xml')
          ET.parse(p)
          text = p.read_text()
          forbidden = [
              '/index.html', '/apr-calculator.html', '/discount-calculator.html',
              '/down-payment-calculator.html', '/markup-calculator.html',
              '/customer-lifetime-value.html', '/gas-mileage.html', '/payroll-tax.html',
              '/equity-calculator.html', '/percentage-calculator.html',
              '/break-even-calculator.html', '/property-tax-calculator.html'
          ]
          found = [x for x in forbidden if f'https://zaculators.com{x}' in text]
          if found:
              raise SystemExit(f'Non-canonical sitemap URLs remain: {found}')
          required = ['/apr.html', '/discount.html', '/down-payment.html', '/markup-tool.html']
          missing = [x for x in required if f'https://zaculators.com{x}' not in text]
          if missing:
              raise SystemExit(f'Restored canonical URLs missing from sitemap: {missing}')
          print('sitemap.xml parses and canonical checks pass')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml '*.html'
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
          else
            git commit -m "Canonicalize sitemap and internal links [skip ci]"
            git push origin HEAD:fix-seo-indexing-2026-09-06
          fi
