name: One-time AdSense Forensic Audit

on:
  push:
    branches:
      - adsense-forensic-audit-2026-09-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-forensic-audit-2026-09-06
      - name: Install crawler dependencies
        run: pip install requests beautifulsoup4
      - name: Crawl live site as Googlebot
        run: python .github/scripts/adsense_forensic_audit.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ADSENSE-FORENSIC-AUDIT.json ADSENSE-FORENSIC-AUDIT.md
          git commit -m "Add AdSense forensic live crawl report [skip ci]" || exit 0
          git push origin HEAD:adsense-forensic-audit-2026-09-06
