name: One-time Repository SEO Audit

on:
  push:
    branches:
      - fix-seo-indexing-2026-09-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-seo-indexing-2026-09-06
          fetch-depth: 0
      - name: Run repository audit
        run: python .github/scripts/repo_seo_audit.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-audit.json
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Add temporary SEO audit report [skip ci]"
            git push origin HEAD:fix-seo-indexing-2026-09-06
          fi
