name: One-time Content Quality Audit

on:
  push:
    branches:
      - audit-thin-content-2026-09-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-thin-content-2026-09-06
          fetch-depth: 0
      - name: Run content quality audit
        run: python .github/scripts/content_quality_audit.py
      - name: Commit audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-quality-audit.json CONTENT-QUALITY-AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Add one-time content quality audit report [skip ci]"
            git push origin HEAD:audit-thin-content-2026-09-06
          fi
